# Sloaner Nexus · Netlify 配置
# 纯静态站点（发布目录为仓库根目录，构建命令留空），另含一个 Serverless Function：
#   /api/* → netlify/functions/api.mjs（留言板评论与点赞，数据存 Netlify Blobs）

[functions]
directory = "netlify/functions"

# 脚本 / 样式：5 分钟短缓存 + 一天后台重新验证，保证发布后快速生效
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=86400"

# 证书图：文件名固定、内容不可变 → 一年强缓存（规则按顺序后者覆盖，须置于通配规则之后）
[[headers]]
  for = "/assets/honors/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
